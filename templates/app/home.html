<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Django App</title>
     <!-- Bootstrap CSS -->


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <!-- Simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 80px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .btn1 {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn1:hover {
            background: #084298;
        }
        .btn2 {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: hsl(60, 73%, 45%);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn2:hover {
            background: #988c08;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to My Django App 🚀</h1>
    <p>This is the home page of my Django application.</p>

    <p>
        Yogesh Bodke

<div>
    <h1 class="my-4">Contact Us</h1>
    {% if submitted %}
        <p id="msg" style="color: green;">Thank you! Your message has been submitted.</p>
    {% endif %}
    <div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn1 btn-primary" type="submit">Submit</button>
            <button class="btn2 btn-warning mx-4" type="reset">Reset</button>
        </form>
    </div>
    
</div>
<script>
    setTimeout(function () {
        const msg = document.getElementById("msg");
        if (msg) {
            msg.style.display = "none";
        }
    }, 5000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
